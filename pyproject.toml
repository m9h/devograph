[project]
name = "devograph"
version = "0.1.0"
description = "Developmental neurobiology extensions for hgx: dynamics, geometric convolutions, optimal transport, and C. elegans tooling."
readme = "README.md"
authors = [
    {name = "Morgan G Hough", email = "morgan.g.hough@gmail.com"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "jax",
    "hypergraph",
    "developmental-biology",
    "c-elegans",
    "graph-neural-networks",
    "neural-ode",
    "optimal-transport",
]
requires-python = ">=3.11"
dependencies = [
    "hgx>=0.1.0",
]

[project.optional-dependencies]
dev = ["pre-commit", "ruff", "optax"]
tests = ["pytest", "beartype"]
dynamics = ["diffrax>=0.6.0"]
geometry = ["e3nn-jax"]
anndata = ["anndata", "scanpy"]
pgmax = ["pgmax"]
topology = ["giotto-tda"]

[project.urls]
repository = "https://github.com/m9h/devograph"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["devograph/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that require network access (deselect with -m 'not slow')",
]

[tool.ruff]
src = []

[tool.ruff.lint]
fixable = ["I001", "F401", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
select = ["E", "F", "I001", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
lines-after-imports = 2
order-by-type = false

[tool.pyright]
include = ["devograph", "test"]
reportIncompatibleMethodOverride = true
